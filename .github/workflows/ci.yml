name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Windows PowerShell process regression
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test-process-runner.ps1
      - run: cargo +1.99.1 fmt --check
      - run: cargo +1.99.1 test --locked
      - run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.99.1 fmt --manifest-path perf/Cargo.toml --check
      - run: cargo +1.99.1 test --locked --manifest-path perf/Cargo.toml
      - run: cargo +1.99.1 clippy --locked --manifest-path perf/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.99.1 build --release --locked --bin api --bin reconcile-cli
      - name: Event API forced restart recovery
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test-event-recovery.ps1 -ApiBinary target/release/api.exe
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            target/release/api*
            target/release/reconcile-cli*
          if-no-files-found: error
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reconcile-test .
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit