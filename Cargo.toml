[package]
default-run = "reconcile-cli"
name = "reconcile-cli"
version = "0.4.0"
license = "MIT"
description = "Rust GPU finance: payment reconciliation, durable event APIs and reproducible GPU compute"
readme = "README.md"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }

utoipa = "5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
subtle = "2"
hmac = "0.12"
http-body-util = "0.1"
mime = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }

tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }

[features]
client = ["dep:reqwest"]
gpu = ["dep:gpu-compute", "dep:fs2"]

[dependencies.gpu-compute]
package = "rust-gpu-finance-compute"
path = "perf/gpu"
optional = true

[dependencies.fs2]
version = "0.4"
optional = true

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["rustls"]
optional = true

[[example]]
name = "reconciliation_lifecycle"
required-features = ["client"]

[[bin]]
name="outbox"
path="src/bin/outbox.rs"
required-features=["client"]

[[bin]]
name="webhook-worker"
path="src/bin/webhook-worker.rs"
required-features=["client"]

[[example]]
name = "partitioned_integration"
required-features = ["client"]
